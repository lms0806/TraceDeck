[package]
name = "trace-deck"
version = "0.1.0"
description = "Secure SSH terminal and log tracing desktop app"
authors = ["TraceDeck"]
edition = "2024"

[workspace]
members = ["core"]
resolver = "3"

[lints]
workspace = true

[lib]
name = "trace_deck_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trace-deck-core = { path = "core" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.1"



[workspace.lints.rust]
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
dead_code = "warn"
unused_variables = "warn"
unused_mut = "warn"
unused_assignments = "warn"
unused_parens = "warn"
unused_macros = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
multiple_crate_versions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
panic = "deny"
cast_lossless = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
redundant_clone = "warn"
needless_borrow = "warn"
redundant_allocation = "warn"
