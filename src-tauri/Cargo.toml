[package]
name = "tracing-log-app"
version = "0.1.0"
description = "Secure SSH terminal and log tracing desktop app"
authors = ["Tracing Log App"]
edition = "2024"

[lib]
name = "tracing_log_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
